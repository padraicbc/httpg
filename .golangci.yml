version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # Tests exercise net/http test servers and best-effort cleanup; checking
      # every Write/Close error there is noise rather than signal.
      - path: _test\.go
        linters:
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
